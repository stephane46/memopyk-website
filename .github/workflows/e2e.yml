name: Blog Hub E2E Tests

on:
  push:
    branches: [staging]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Create .env.e2e
        run: |
          echo "E2E_BASE_URL=${{ secrets.E2E_BASE_URL }}" >> .env.e2e
          echo "E2E_ADMIN_PASSWORD=${{ secrets.E2E_ADMIN_PASSWORD }}" >> .env.e2e

      - name: Wait for Coolify deployment
        run: |
          echo "Waiting 60s for Coolify to complete deployment..."
          sleep 60
          echo "Checking staging health..."
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.E2E_BASE_URL }}/api/health" || echo "Health check endpoint not available, continuing anyway"

      - name: Run Discovery Tests
        id: discovery
        continue-on-error: true
        run: npm run e2e:discovery

      - name: Run Flow Tests
        id: flows
        continue-on-error: true
        run: npm run e2e:flows

      - name: Generate QA Report
        run: npm run e2e:report-md

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            !test-results/**/*.zip
          retention-days: 14

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Print QA Report Summary
        if: always()
        run: |
          echo "=== Blog Hub QA Report Summary ==="
          if [ -f "test-results/qa-report.md" ]; then
            # Print the executive summary section
            head -30 test-results/qa-report.md
          else
            echo "QA Report not generated"
          fi
          echo "=================================="

      - name: Check test results
        if: steps.discovery.outcome == 'failure' && steps.flows.outcome == 'failure'
        run: |
          echo "Both discovery and flow tests failed"
          exit 1
